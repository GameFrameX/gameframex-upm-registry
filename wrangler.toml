name = "gameframex-upm-cloudflare-worker"
main = "src/index.ts"
compatibility_date = "2026-05-25"
workers_dev = true

[vars]
CNB_ARTIFACT_PAGE_URL = "https://cnb.cool/GameFrameX/npm"
CNB_NPM_REGISTRY_URL = "https://npm.cnb.cool/GameFrameX/npm/-/packages/"
REGISTRY_NAME = "GameFrameX UPM Registry"
